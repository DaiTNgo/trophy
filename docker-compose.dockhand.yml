services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: trophy_dockhand
    restart: unless-stopped
    ports:
      - "${DOCKHAND_PORT:-3001}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

volumes:
  dockhand_data:
    driver: local
