types { application/javascript mjs; }

# ==============================================================================
# Upstream Pools
# ==============================================================================
upstream backend_upstream {
    server backend:8787;
    keepalive 32;
}

upstream storefront_upstream {
    server storefront:3000;
    keepalive 32;
}

upstream admin_upstream {
    server admin:80;
    keepalive 32;
}

# ==============================================================================
# Rate Limiting
# ==============================================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


# ==============================================================================
# HTTP - All Domains (Redirect to HTTPS)
# ACME remains on HTTP; everything else redirects to HTTPS
# ==============================================================================
server {
    listen 80 default_server;
    server_name ptplatinum.vn admin.ptplatinum.vn api.ptplatinum.vn;

    server_tokens off;
    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ==============================================================================
# HTTPS - Main Domain
# Storefront + /api + /admin
# ==============================================================================
server {
    listen 443 ssl;
    server_name ptplatinum.vn;

    server_tokens off;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/ptplatinum.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptplatinum.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------------------------
    # Gzip
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Timeouts
    # --------------------------------------------------------------------------
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # --------------------------------------------------------------------------
    # Block dotfiles
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Fonts
    # --------------------------------------------------------------------------
    location /fonts/ {
        proxy_pass http://backend_upstream/fonts/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # Storefront Assets
    # --------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://storefront_upstream/assets/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # Storefront SSR
    # --------------------------------------------------------------------------
    location / {
        limit_conn conn_limit 50;

        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# ==============================================================================
# HTTPS - Admin
# ==============================================================================
server {
    listen 443 ssl;
    server_name admin.ptplatinum.vn;

    server_tokens off;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/ptplatinum.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptplatinum.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Auth
    location /api/admin/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend_upstream/api/admin/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin
    location / {
        proxy_pass http://admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


