services:
  # ============================================================================
  # 1. Database Service (PostgreSQL 16 Alpine)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: trophy_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trophy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trophy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trophy}
    # Security: Bind ONLY to loopback 127.0.0.1 to avoid public internet exposure
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trophy} -d ${POSTGRES_DB:-trophy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - trophy_net

  # ============================================================================
  # 2. Backend API Service (Hono + Node.js 22)
  # ============================================================================
  backend:
    image: ${IMAGE_BACKEND:-trophy-backend:local}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: trophy_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-trophy}:${POSTGRES_PASSWORD:-trophy_secret}@db:5432/${POSTGRES_DB:-trophy}
      STORAGE_DIR: /app/storage
      PUBLIC_BACKEND_URL: ${BACKEND_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN}
      STOREFRONT_APP_ORIGIN: ${STOREFRONT_APP_ORIGIN}
      MISA_CLIENT_ID: ${MISA_CLIENT_ID:-}
      MISA_CLIENT_SECRET: ${MISA_CLIENT_SECRET:-}
      MISA_API_BASE_URL: ${MISA_API_BASE_URL:-https://crmconnect.misa.vn/api/v2}
    volumes:
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8787}:8787"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - trophy_net

  # ============================================================================
  # 3. Storefront SSR Service (React Router v7)
  # ============================================================================
  storefront:
    image: ${IMAGE_STOREFRONT:-trophy-storefront:local}
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: trophy_storefront
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8787
      BACKEND_URL: ${BACKEND_PUBLIC_URL}
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-3000}:3000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - trophy_net

  # ============================================================================
  # 4. Admin Portal Service (SPA Static Nginx)
  # ============================================================================
  admin:
    image: ${IMAGE_ADMIN:-trophy-admin:local}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: trophy_admin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5174}:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - trophy_net

  # ============================================================================
  # 5. Gateway Reverse Proxy Service (Nginx Alpine)
  # ============================================================================
  gateway:
    image: nginx:alpine
    container_name: trophy_gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - trophy_net

  # ============================================================================
  # 5b. Certbot (Let's Encrypt SSL)
  # ============================================================================
  certbot:
    image: certbot/certbot
    container_name: trophy_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - trophy_net

  # ============================================================================
  # 6. Docker Management Dashboard (Dockhand - https://dockhand.pro)
  # ============================================================================
  dockhand:
    image: fnsys/dockhand:latest
    container_name: trophy_dockhand
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKHAND_PORT:-3001}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    profiles:
      - dockhand
      - tools
    networks:
      - trophy_net

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  dockhand_data:
    driver: local

# ==============================================================================
# Dedicated Bridge Network
# ==============================================================================
networks:
  trophy_net:
    driver: bridge
